# DEPLOY-MIGRATE (2026-08-25): Backend Render (thay Railway) + Turso remote DB.
# Blueprint deploy: Render Dashboard → New → Blueprint → trỏ repo này.
# LƯU Ý:
# - DB KHÔNG còn file local: bắt buộc set TURSO_URL + TURSO_AUTH_TOKEN (ADR-041).
# - Các secret đánh dấu sync:false phải nhập tay trong Render Dashboard sau lần
#   sync đầu tiên — KHÔNG bao giờ commit secret vào repo.
# - Healthcheck /health (healthRouter) — Render gọi để xác định deploy thành công.
services:
  - type: web
    name: tnttvn-api
    # LƯU Ý (2026-08-25): service thực tế trên Render do user tạo tay tên "TNTTVN"
    # → domain thật là https://tnttvn.onrender.com (đã đồng bộ vercel.json + mobile).
    # Blueprint này chỉ dùng khi tái tạo service từ đầu qua Blueprints.
    plan: free
    healthCheckPath: /health
    # RELEASE-GATE-1 (ADR-057): production chi deploy dung commit SHA da qua CI.
    # Workflow deploy-production.yml goi Render API voi commitId bat bien.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # One Render service owns exactly one parish namespace.
      - key: DEPLOYMENT_PARISH_ID
        value: gia-ton
      - key: PARISH_TIME_ZONE
        value: Asia/Ho_Chi_Minh
      # CORS cho SPA trên Vercel + Native Capacitor (originPolicy.ts allowlist).
      - key: CLIENT_ORIGIN
        value: https://tnttvn.vercel.app,capacitor://localhost,https://localhost,http://localhost
      # ─── DB (Turso) ───
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # ─── Secrets (bắt buộc — xem .env.example) ───
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # SEC-HMAC-1: bắt buộc ở production, fail-closed khi thiếu.
      - key: REPORT_HMAC_SECRET
        sync: false
      # Chỉ dùng lúc khởi tạo DB TRỐNG lần đầu (tạo user admin).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # ─── Tuỳ chọn ───
      - key: OPS_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # ─── Native push (ADR-095): FCM Android + APNs iOS ───
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.tnttvn.app
      - key: APNS_ENVIRONMENT
        value: production
      # ─── Backup Turso độc lập, mã hóa phía ứng dụng (ADR-059) ───
      - key: AUTO_BACKUP_ENABLED
        value: true
      - key: BACKUP_RETENTION_COUNT
        value: 7
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
