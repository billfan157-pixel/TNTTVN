name: Worker incident alert

# After the Cloudflare Worker owns production ingress it also owns every scheduled
# writer, so a silent Durable Object failure is a data-integrity incident. This
# watcher turns the structured failure markers and any uncaught Worker exception
# into a tracked issue instead of a log line nobody reads.
#
# Exit code 2 from the detector means "incident seen". The job then fails on
# purpose and opens or updates one issue, so a real event is impossible to miss
# and a quiet window stays green. Exit code 1 means the watcher itself failed,
# which is also escalated rather than reported as a clean window.
#
# Coverage boundary: wrangler tail is a live stream, so each run sees only its own
# window. The schedule below runs a 20-minute window every 30 minutes. Closing the
# remaining gap needs the Cloudflare Observability query API, whose request body
# could not be verified here because the production CLOUDFLARE_API_TOKEN value is
# not readable from a workstation.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Tail window in minutes (1-55)'
        required: false
        default: '20'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: worker-incident-alert
  cancel-in-progress: true

jobs:
  watch:
    name: Watch the production Worker for maintenance, backup, and exception incidents
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_MINUTES: ${{ inputs.window_minutes || '20' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/cloudflare-free-feasibility/package-lock.json

      - name: Install pinned Wrangler dependencies
        working-directory: tools/cloudflare-free-feasibility
        run: npm ci --no-audit --no-fund

      - name: Detect Worker incidents
        id: detect
        working-directory: tools/cloudflare-free-feasibility
        run: |
          set +e
          output="$(node detect-worker-incidents.mjs "${WINDOW_MINUTES}")"
          status=$?
          set -e
          echo "$output"
          echo "detector_exit=$status" >> "$GITHUB_OUTPUT"
          detected="$(printf '%s' "$output" | jq -r '.detected // false')"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
          watched="$(printf '%s' "$output" | jq -r '.watched // false')"
          echo "watched=$watched" >> "$GITHUB_OUTPUT"
          echo "markers=$(printf '%s' "$output" | jq -c '.byMarker // {}')" >> "$GITHUB_OUTPUT"
          echo "maintenance_kinds=$(printf '%s' "$output" | jq -c '.maintenanceKinds // {}')" >> "$GITHUB_OUTPUT"
          echo "exceptions=$(printf '%s' "$output" | jq -r '.exceptions // 0')" >> "$GITHUB_OUTPUT"

      - name: Open or update the incident tracking issue
        if: steps.detect.outputs.detected == 'true' || steps.detect.outputs.watched != 'true'
        run: |
          set -euo pipefail
          title='Production Worker incident observed'
          if [ "${{ steps.detect.outputs.watched }}" != 'true' ]; then
            summary='The watcher itself failed, so this window proves nothing.'
          else
            summary='Structured Worker failure markers or an uncaught exception were observed.'
          fi
          body="$(printf '%s\n' \
            "$summary" \
            '' \
            "- markers: ${{ steps.detect.outputs.markers }}" \
            "- maintenance kinds: ${{ steps.detect.outputs.maintenance_kinds }}" \
            "- uncaught exceptions: ${{ steps.detect.outputs.exceptions }}" \
            "- window minutes: ${{ env.WINDOW_MINUTES }}" \
            "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '' \
            'If the Worker owns maintenance, treat a failing job kind as a writer' \
            'that stopped. Check the Durable Object storage lastFailureAt value and' \
            'the recovery quarantine marker before clearing anything.')"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the run so the signal is visible
        if: steps.detect.outputs.detected == 'true' || steps.detect.outputs.watched != 'true'
        run: |
          echo "Worker incident detected: markers=${{ steps.detect.outputs.markers }} exceptions=${{ steps.detect.outputs.exceptions }}" >&2
          exit 1
