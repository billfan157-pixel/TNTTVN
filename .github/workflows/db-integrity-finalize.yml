import { and, eq } from 'drizzle-orm'
import { db } from '../db/index.js'
import { outboxMessages } from '../db/schema.js'
import { dispatchPendingOutboxEvents, eventPublisher } from '../services/outboxService.js'

const parishId = 'outbox-claim-race'
const messageId = 'OUT-CLAIM-RACE-1'
const eventType = 'OutboxClaimRaceTest'
let deliveries = 0

async function cleanup() {
  await db.delete(outboxMessages).where(eq(outboxMessages.parishId, parishId))
}

describe('Outbox atomic claim lease', () => {
  beforeAll(async () => {
    await cleanup()
    eventPublisher.subscribe(eventType, async () => {
      await new Promise(resolve => setTimeout(resolve, 50))
      deliveries++
    })
  })

  afterAll(async () => {
    await cleanup()
  })

  it('allows only one of two concurrent workers to publish the same pending row', async () => {
    deliveries = 0
    await db.insert(outboxMessages).values({
      id: messageId,
