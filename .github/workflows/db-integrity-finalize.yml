              t = t[:pos] + receipt_test + t[pos:]
          p2.write_text(t)

          # 10) Outbox atomic DB claim lease. This prevents two workers from publishing the same pending row concurrently.
          p2 = Path('server/src/services/outboxService.ts')
          t = p2.read_text()
          t = t.replace("import { db, type DbTransaction } from '../db/index.js'", "import { db, runDbTransaction, type DbTransaction } from '../db/index.js'")
          t = t.replace("import { eq, sql } from 'drizzle-orm'", "import { and, eq, lte, sql } from 'drizzle-orm'")
          t = t.replace("""export async function processOutboxCycle(): Promise<{ requeued: number; processed: number; failed: number }> {
  const requeued = await retryFailedOutboxMessages()
  const result = await dispatchPendingOutboxEvents()
  return { requeued, processed: result.processed, failed: result.failed }
}""", """export async function processOutboxCycle(): Promise<{ requeued: number; processed: number; failed: number }> {
  const recovered = await recoverExpiredOutboxClaims()
  const requeued = await retryFailedOutboxMessages()
  const result = await dispatchPendingOutboxEvents()
  return { requeued: recovered + requeued, processed: result.processed, failed: result.failed }
}""")

          start_retry = t.index('export async function retryFailedOutboxMessages(): Promise<number> {')
          start_dispatch = t.index('export async function dispatchPendingOutboxEvents(): Promise<{ processed: number; failed: number }> {')
          before_retry = t[:start_retry]
          dispatch_and_after = t[start_dispatch:]
          helpers_and_retry = """const OUTBOX_CLAIM_LEASE_MS = 60_000

async function recoverExpiredOutboxClaims(): Promise<number> {
  const now = new Date().toISOString()
  return runDbTransaction(async (tx) => {
    const recovered = await tx
      .update(outboxMessages)
      .set({ status: 'pending', lockedBy: null, lockedUntil: null })
      .where(and(eq(outboxMessages.status, 'processing'), lte(outboxMessages.lockedUntil, now)))
      .returning({ id: outboxMessages.id })
    return recovered.length
  })
}

export async function retryFailedOutboxMessages(): Promise<number> {
  const failed = await db
    .select()
    .from(outboxMessages)
    .where(eq(outboxMessages.status, 'failed'))
    .limit(50)

  let requeued = 0
  for (const msg of failed) {
    const changed = await runDbTransaction((tx) => tx
      .update(outboxMessages)
      .set({ status: 'pending', lockedBy: null, lockedUntil: null })
      .where(and(
        eq(outboxMessages.parishId, msg.parishId),
        eq(outboxMessages.id, msg.id),
        eq(outboxMessages.status, 'failed'),
      ))
      .returning({ id: outboxMessages.id }))
    requeued += changed.length
  }

  return requeued
}

"""
          t = before_retry + helpers_and_retry + dispatch_and_after
