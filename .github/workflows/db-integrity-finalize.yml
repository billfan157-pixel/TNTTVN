          ]:
              p2 = Path(path)
              t = p2.read_text().replace("'2.0-production'", "'3.0-operational'")
              p2.write_text(t)

          p2 = Path('server/src/__tests__/security/authorization-matrix-audit-b.test.ts')
          t = p2.read_text()
          anchor = "describe('B-03: Restore Backup Cross-Tenant Overwrite Protection'"
          idx = t.find(anchor)
          if idx < 0:
