""")

          # 12) Authoritative architecture record. Keep ADR-052 untouched.
          adr = Path('docs/adr/ADR-053-database-lifecycle-and-concurrency-hardening.md')
          if not adr.exists():
              adr.write_text("""# ADR-053: Database Lifecycle and Concurrency Hardening

**Status:** Accepted  
**Date:** 2026-08-21

## Context

The database integrity audit identified executable gaps between the evolving tenant schema and the manually maintained backup, restore, purge and startup-health inventories, plus SQLite DEFERRED-transaction contention and worker-claim races.

## Decision

1. `server/src/db/dataLifecycle.ts` is the lifecycle SSOT for tenant business tables covered by logical backup, destructive purge, safety snapshots and critical composite-PK checks.
2. Logical backup format `3.0-operational` is created from one read transaction with stable ordering. Restore is transactional, verifies restored counts, and writes the success audit in the same commit.
3. Local physical SQLite backup fails closed if `VACUUM INTO` cannot create a coherent snapshot; copying a live WAL-mode `.db` file is not an accepted fallback.
4. `runDbTransaction` retries the full `SQLITE_BUSY*` family, including wrapped `SQLITE_BUSY_SNAPSHOT`, with bounded exponential backoff and jitter.
5. Finance receipt numbers required by Business Rules §23.3 are database-unique per `(parish_id, receipt_number)`. Automatic `MAX+1` allocation acquires the SQLite writer before reading the current maximum. Migration 128 intentionally fails closed if historical duplicate non-NULL receipt numbers already exist; it does not silently renumber accounting history.
6. Outbox workers atomically claim `pending -> processing` with a lease before external delivery. Concurrent workers therefore cannot publish the same pending row simultaneously. Delivery remains explicitly **at-least-once**: Telegram delivery and the local DB state transition cannot be atomically committed together, so a crash after external delivery but before `dispatched` may redeliver after lease expiry rather than lose the event.
7. Receipt deletion/voiding policy is not changed by this ADR because no authoritative business rule currently defines whether issued voucher numbers must be retained as voided records after deletion.

## Verification

CI regression coverage includes backup lifecycle round-trip, purge of legacy assessment/Finance/leave data, fee-payment replay idempotency, true Grade OCC concurrency, Exam finalize/delete races, wrapped SQLite busy detection, concurrent receipt allocation, and concurrent outbox worker claim behavior.
""")
