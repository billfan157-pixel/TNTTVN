          before, block = t[:idx], t[idx:]
          if 'expect(res.status).toBe(500)' in block:
              block = block.replace('expect(res.status).toBe(500)', 'expect(res.status).toBe(409)', 1)
          elif 'expect(res.status).toBe(409)' not in block:
