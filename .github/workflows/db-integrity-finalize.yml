          t = t[:start_dispatch] + """export async function dispatchPendingOutboxEvents(): Promise<{ processed: number; failed: number }> {
  const pending = await db
    .select()
    .from(outboxMessages)
    .where(eq(outboxMessages.status, 'pending'))
    .limit(50)

  const workerId = generateId('OBW')
  let processed = 0
  let failed = 0

  for (const msg of pending) {
    const lockedUntil = new Date(Date.now() + OUTBOX_CLAIM_LEASE_MS).toISOString()
    const claimed = await runDbTransaction((tx) => tx
      .update(outboxMessages)
      .set({ status: 'processing', lockedBy: workerId, lockedUntil })
      .where(and(
        eq(outboxMessages.parishId, msg.parishId),
        eq(outboxMessages.id, msg.id),
        eq(outboxMessages.status, 'pending'),
      ))
      .returning({ id: outboxMessages.id }))

    if (claimed.length === 0) continue

    const event: IntegrationEvent = {
      id: msg.id,
      aggregateId: msg.aggregateId,
      eventType: msg.eventType,
      payload: JSON.parse(msg.payload),
      createdAt: msg.createdAt,
    }

    try {
      await eventPublisher.publish(event)
    } catch {
      await runDbTransaction((tx) => tx
        .update(outboxMessages)
        .set({ status: 'failed', lockedBy: null, lockedUntil: null })
        .where(and(
          eq(outboxMessages.parishId, msg.parishId),
          eq(outboxMessages.id, msg.id),
          eq(outboxMessages.status, 'processing'),
          eq(outboxMessages.lockedBy, workerId),
        )))
      failed++
      continue
    }

    // External delivery and DB commit cannot be one atomic transaction. Keep a
    // processing lease until this write succeeds; a crash here is intentionally
    // at-least-once and may redeliver after lease expiry rather than lose the event.
    await runDbTransaction((tx) => tx
      .update(outboxMessages)
      .set({ status: 'dispatched', lockedBy: null, lockedUntil: null })
      .where(and(
        eq(outboxMessages.parishId, msg.parishId),
        eq(outboxMessages.id, msg.id),
        eq(outboxMessages.status, 'processing'),
        eq(outboxMessages.lockedBy, workerId),
      )))
    processed++
  }

  return { processed, failed }
}
"""
