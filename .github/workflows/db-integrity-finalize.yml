          t = t.replace("    } else {\n      expect(session!.status).toBe('draft')\n      expect(results).toHaveLength(0)\n      expect(finalizations).toHaveLength(0)\n    }", "    } else {\n      expect(session!.status).toBe('draft')\n      expect(finalizations).toHaveLength(0)\n      if (deleteOutcome.status === 'fulfilled') expect(results).toHaveLength(0)\n      else expect(results).toHaveLength(1)\n      if (finalizeOutcome.status === 'fulfilled') {\n        throw new Error('finalizeExamSession reported success without completing the session')\n      }\n    }")
          t = t.replace("    await Promise.allSettled([\n      finalizeExamSession(sessionId, userId, parishId, '127.0.0.1', 'vitest', null),\n      deleteExamSession(sessionId, userId, parishId, '127.0.0.1', 'vitest', null),\n    ])", "    const [finalizeOutcome, deleteOutcome] = await Promise.allSettled([\n      finalizeExamSession(sessionId, userId, parishId, '127.0.0.1', 'vitest', null),\n      deleteExamSession(sessionId, userId, parishId, '127.0.0.1', 'vitest', null),\n    ])")
          t = t.replace("    } else {\n      expect(session.status).toBe('completed')\n      const results = await db.select().from(examResults)", "    } else {\n      if (session.status === 'draft') {\n        expect(finalizeOutcome.status).toBe('rejected')\n        expect(deleteOutcome.status).toBe('rejected')\n        return\n      }\n      expect(session.status).toBe('completed')\n      const results = await db.select().from(examResults)")
          p2.write_text(t)

          # 9) True concurrent receipt allocation regression.
          p2 = Path('server/src/__tests__/financePaymentIdempotency.test.ts')
          t = p2.read_text()
          t = t.replace("import { updateStudentFee } from '../services/FinanceApplicationService.js'", "import { createTransaction, updateStudentFee } from '../services/FinanceApplicationService.js'")
          receipt_test = """

  it('allocates distinct consecutive receipt numbers under simultaneous writers', async () => {
