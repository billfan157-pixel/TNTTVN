    await tx.delete(grades).where(eq(grades.parishId, parishId))
    await tx.delete(students).where(eq(students.parishId, parishId))
    await tx.delete(classes).where(eq(classes.parishId, parishId))
    await tx.delete(users).where(eq(users.parishId, parishId))
    await tx.delete(branches).where(eq(branches.parishId, parishId))
    await tx.delete(academicYears).where(eq(academicYears.parishId, parishId))
  })
}"""
