          t = p2.read_text()
          t = t.replace("import { db } from '../db/index.js'", "import { db, runDbTransaction } from '../db/index.js'")
          old_cleanup = """async function cleanup() {
  await db.delete(auditLogs).where(eq(auditLogs.parishId, parishId))
  await db.delete(grades).where(eq(grades.parishId, parishId))
