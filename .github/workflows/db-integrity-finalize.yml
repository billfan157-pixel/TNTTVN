name: Finalize DB integrity remediation

on:
  push:
    branches:
      - agent/fix-db-integrity-concurrency-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-db-integrity-concurrency-audit
          fetch-depth: 0
      - name: Apply evidence-backed final patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              p.write_text(text.replace(old, new))

          # 1) Generic transaction retry must recognize wrapped SQLITE_BUSY_* / BUSY_SNAPSHOT.
          replace(
              'server/src/db/index.ts',
              "import { createClient, LibsqlError } from '@libsql/client'",
              "import { createClient } from '@libsql/client'",
          )
          replace(
              'server/src/db/index.ts',
              "import { applyMigrations } from './migrationRunner.js'\n",
              "import { applyMigrations } from './migrationRunner.js'\nimport { isSqliteBusyError } from './sqliteErrors.js'\n",
          )
          replace(
              'server/src/db/index.ts',
              "      const busy = err instanceof LibsqlError && err.code === 'SQLITE_BUSY'\n      if (!busy || attempt >= MAX_TX_BUSY_RETRY) throw err\n      await new Promise((r) => setTimeout(r, 25 * 2 ** attempt))",
              "      const busy = isSqliteBusyError(err)\n      if (!busy || attempt >= MAX_TX_BUSY_RETRY) throw err\n      const baseDelayMs = Math.min(250, 25 * 2 ** attempt)\n      const jitterMs = Math.floor(Math.random() * Math.max(20, Math.floor(baseDelayMs * 0.35)))\n      await new Promise((r) => setTimeout(r, baseDelayMs + jitterMs))",
          )

          # 2) New migrations: authoritative receipt uniqueness + outbox claim lease.
          p = Path('server/src/db/index.ts')
          text = p.read_text()
          migration_boundary = "]\n\n// Root-cause remediation: migration execution itself now fails closed."
          migrations = """  { version: '20260821-128', sql: `
CREATE UNIQUE INDEX IF NOT EXISTS idx_transactions_receipt_unique
ON financial_transactions(parish_id, receipt_number);
` },
  { version: '20260821-129', sql: `
ALTER TABLE outbox_messages ADD COLUMN locked_by TEXT;
ALTER TABLE outbox_messages ADD COLUMN locked_until TEXT;
DROP TRIGGER IF EXISTS check_outbox_messages_status_insert;
DROP TRIGGER IF EXISTS check_outbox_messages_status_update;
CREATE TRIGGER check_outbox_messages_status_insert BEFORE INSERT ON outbox_messages BEGIN
  SELECT CASE WHEN NEW.status NOT IN ('pending', 'processing', 'dispatched', 'failed')
    THEN RAISE(ABORT, 'outbox_messages status invalid') END;
END;
CREATE TRIGGER check_outbox_messages_status_update BEFORE UPDATE ON outbox_messages BEGIN
  SELECT CASE WHEN NEW.status NOT IN ('pending', 'processing', 'dispatched', 'failed')
    THEN RAISE(ABORT, 'outbox_messages status invalid') END;
END;
CREATE INDEX IF NOT EXISTS idx_outbox_messages_claim
ON outbox_messages(status, locked_until, created_at);
` },
]"""
          if "version: '20260821-128'" not in text:
              if migration_boundary not in text:
                  raise SystemExit('server/src/db/index.ts: migration boundary not found')
              text = text.replace("]\n\n// Root-cause remediation: migration execution itself now fails closed.", migrations + "\n\n// Root-cause remediation: migration execution itself now fails closed.", 1)

          # Defensive post-migration index/trigger repair must match the new executable contract,
          # without mutating historical migration SQL text.
          prefix, sep, suffix = text.partition('const MIGRATIONS = [')
          if not sep:
              raise SystemExit('server/src/db/index.ts: MIGRATIONS partition not found')
          if 'idx_transactions_receipt_unique' not in prefix:
              anchor = "  'CREATE INDEX IF NOT EXISTS idx_outbox_messages_status ON outbox_messages(status, created_at)',"
              if anchor not in prefix:
                  raise SystemExit('server/src/db/index.ts: outbox defensive index anchor missing')
              prefix = prefix.replace(anchor, anchor + "\n  'CREATE INDEX IF NOT EXISTS idx_outbox_messages_claim ON outbox_messages(status, locked_until, created_at)',\n  'CREATE UNIQUE INDEX IF NOT EXISTS idx_transactions_receipt_unique ON financial_transactions(parish_id, receipt_number)',", 1)
          prefix = prefix.replace("NEW.status NOT IN ('pending', 'dispatched', 'failed')", "NEW.status NOT IN ('pending', 'processing', 'dispatched', 'failed')")
          text = prefix + sep + suffix
          p.write_text(text)

          # 3) Drizzle schema mirrors receipt and outbox invariants.
          replace(
              'server/src/db/schema.ts',
              "  index('idx_transactions_class').on(table.parishId, table.classId),\n])",
              "  index('idx_transactions_class').on(table.parishId, table.classId),\n  uniqueIndex('idx_transactions_receipt_unique').on(table.parishId, table.receiptNumber),\n])",
          )
          replace(
              'server/src/db/schema.ts',
              "  status: text('status', { enum: ['pending', 'dispatched', 'failed'] }).notNull().default('pending'),\n  sequenceNumber: integer('sequence_number').notNull().default(1),\n  parishId: text('parish_id').notNull().default('gia-ton'),",
              "  status: text('status', { enum: ['pending', 'processing', 'dispatched', 'failed'] }).notNull().default('pending'),\n  sequenceNumber: integer('sequence_number').notNull().default(1),\n  parishId: text('parish_id').notNull().default('gia-ton'),\n  lockedBy: text('locked_by'),\n  lockedUntil: text('locked_until'),",
          )
          replace(
              'server/src/db/schema.ts',
              "  index('idx_outbox_messages_parish').on(table.parishId, table.status),\n])",
              "  index('idx_outbox_messages_parish').on(table.parishId, table.status),\n  index('idx_outbox_messages_claim').on(table.status, table.lockedUntil, table.createdAt),\n])",
          )

          # 4) Startup schema health covers both new invariants.
          replace(
              'server/src/db/schemaHealth.ts',
              "  ...migrationRange('20260820', 126, 127),\n] as const",
              "  ...migrationRange('20260820', 126, 127),\n  ...migrationRange('20260821', 128, 129),\n] as const",
          )
          replace(
              'server/src/db/schemaHealth.ts',
              "  idx_exam_sessions_idempotency: ['parish_id', 'idempotency_key'],\n}",
              "  idx_exam_sessions_idempotency: ['parish_id', 'idempotency_key'],\n  idx_transactions_receipt_unique: ['parish_id', 'receipt_number'],\n  idx_outbox_messages_claim: ['status', 'locked_until', 'created_at'],\n}",
          )
          replace(
              'server/src/db/schemaHealth.ts',
              "  student_fee_records: ['parish_id', 'student_id', 'class_id', 'transaction_id'],\n}",
              "  student_fee_records: ['parish_id', 'student_id', 'class_id', 'transaction_id'],\n  outbox_messages: ['parish_id', 'status', 'locked_by', 'locked_until'],\n}",
          )
          replace(
              'server/src/__tests__/schemaHealth.test.ts',
              "  idx_exam_sessions_idempotency: ['parish_id', 'idempotency_key'],\n}",
              "  idx_exam_sessions_idempotency: ['parish_id', 'idempotency_key'],\n  idx_transactions_receipt_unique: ['parish_id', 'receipt_number'],\n  idx_outbox_messages_claim: ['status', 'locked_until', 'created_at'],\n}",
          )
          replace(
              'server/src/__tests__/schemaHealth.test.ts',
              "  student_fee_records: ['parish_id', 'student_id', 'class_id', 'transaction_id'],\n}",
              "  student_fee_records: ['parish_id', 'student_id', 'class_id', 'transaction_id'],\n  outbox_messages: ['parish_id', 'status', 'locked_by', 'locked_until'],\n}",
          )

          # 5) Receipt allocation: acquire SQLite writer before MAX+1 read.
          replace(
              'server/src/services/FinanceApplicationService.ts',
              "  if (!receiptNumber) {\n    const prefix = data.type === 'INCOME' ? 'PT' : data.type === 'EXPENSE' ? 'PC' : 'UNC'",
              "  if (!receiptNumber) {\n    // BR §23.3: serialize receipt allocation before reading MAX. The no-op UPDATE\n    // acquires the SQLite writer; a competing stale DEFERRED snapshot is retried\n    // by runDbTransaction via the shared SQLITE_BUSY_* detector.\n    await tx.run(sql`UPDATE funds SET updated_at = updated_at WHERE parish_id = ${parishId} AND id = ${data.fundId}`)\n\n    const prefix = data.type === 'INCOME' ? 'PT' : data.type === 'EXPENSE' ? 'PC' : 'UNC'",
          )

          # 6) Existing tests follow the intentional backup-v3 / 409 contract.
          for path in [
              'server/src/__tests__/routes/backup.test.ts',
