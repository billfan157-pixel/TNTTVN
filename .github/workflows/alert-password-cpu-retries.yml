name: Password CPU retry alert

# A Durable Object code-update reset interrupts in-flight password RPCs. The bounded
# retry in server/src/utils/passwordCompute.ts recovers from it and logs
# PASSWORD_CPU_RETRY. The reset cannot be reproduced on demand, so this scheduled job
# watches the production Worker log stream and turns any retry into a tracked issue.
#
# Coverage boundary: wrangler tail is a live stream, so each run sees only its own
# window. The schedule below runs a 25-minute window every 30 minutes, leaving a small
# gap. Closing that gap needs the Cloudflare Observability query API, whose request body
# could not be verified here because the production CLOUDFLARE_API_TOKEN value is not
# readable from a workstation.
#
# Exit code 2 from the detector means "retry seen". The job then fails on purpose and
# opens or updates one issue, so a real event is impossible to miss and a quiet window
# stays green.

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Tail window in minutes (1-55)'
        required: false
        default: '25'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: password-cpu-retry-alert
  cancel-in-progress: true

jobs:
  watch:
    name: Watch the production Worker for password CPU retries
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_MINUTES: ${{ inputs.window_minutes || '25' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/cloudflare-free-feasibility/package-lock.json

      - name: Install pinned Wrangler dependencies
        working-directory: tools/cloudflare-free-feasibility
        run: npm ci --no-audit --no-fund

      - name: Detect password CPU retries
        id: detect
        working-directory: tools/cloudflare-free-feasibility
        run: |
          set +e
          output="$(node detect-password-cpu-retries.mjs "${WINDOW_MINUTES}")"
          status=$?
          set -e
          echo "$output"
          echo "detector_exit=$status" >> "$GITHUB_OUTPUT"
          detected="$(printf '%s' "$output" | jq -r '.detected // false')"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
          echo "events=$(printf '%s' "$output" | jq -r '.events // 0')" >> "$GITHUB_OUTPUT"
          echo "reasons=$(printf '%s' "$output" | jq -c '.reasons // {}')" >> "$GITHUB_OUTPUT"

      - name: Open or update the retry tracking issue
        if: steps.detect.outputs.detected == 'true'
        run: |
          set -euo pipefail
          title='Password CPU retry observed in the production Worker'
          body="$(printf '%s\n' \
            'The bounded password compute retry fired on the production Worker.' \
            '' \
            "- events in window: ${{ steps.detect.outputs.events }}" \
            "- reasons: ${{ steps.detect.outputs.reasons }}" \
            "- window minutes: ${{ env.WINDOW_MINUTES }}" \
            "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '' \
            'A Durable Object code-update reset is the known cause. Check Workers' \
            'Observability for the reset event, confirm the login still returned 200,' \
            'and confirm no `PASSWORD_CPU_RETRY` line carried a secret.')"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the run so the signal is visible
        if: steps.detect.outputs.detected == 'true'
        run: |
          echo "PASSWORD_CPU_RETRY observed: ${{ steps.detect.outputs.reasons }}" >&2
          exit 1
