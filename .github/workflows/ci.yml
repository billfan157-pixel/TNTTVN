name: Parish LMS Enterprise CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  preview-ingress:
    # vercel.json can give two layers ownership of the same path (Routing Middleware
    # and an external rewrite). When both claimed /api and /health, API requests were
    # answered with the SPA index.html on the preview while production still used the
    # legacy rewrite, so unit tests stayed green and only a live probe exposed it.
    name: Preview ingress ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for the Vercel preview deployment of this commit
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha }}"
          for attempt in $(seq 1 60); do
            # The Vercel GitHub app reports its deployment as a commit *status*
            # (context "Vercel"), not as a check run, so poll the status API.
            state="$(gh api "repos/${{ github.repository }}/commits/${sha}/status" \
              --jq '[.statuses[] | select(.context == "Vercel")] | last | .state // "pending"')"
            case "$state" in
              success) echo "Vercel deployment ready."; exit 0 ;;
              pending) ;;
              *) echo "Vercel deployment ended in $state" >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the Vercel preview deployment." >&2
          exit 1

      - name: Resolve the preview deployment URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the URL the Vercel app published for this pull request; fall back to
          # the branch alias when the comment has not landed yet.
          url="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq 'map(select(.user.login == "vercel[bot]")) | last | .body' \
            | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "Could not resolve a Vercel preview URL from the pull request." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Probing $url"

      - name: Prove proxy.ts owns the API and health paths
        run: >-
          node tools/cloudflare-free-feasibility/verify-preview-ingress.mjs
          "${{ steps.preview.outputs.url }}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action v2 uploads results.sarif as a workflow artifact;
      # without actions:write the upload 403s and fails the job even when
      # the scan itself finds no leaks.
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --allow-remote=all

      - name: Test production boundary contract
        run: node --test tools/cloudflare-free-feasibility/verify-production-boundary.test.mjs

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Verify Architecture Inventory
        run: npm run lint:architecture-inventory

      - name: Typecheck TypeScript
        run: |
          npx tsc -b --noEmit
          npx tsc --noEmit -p server/tsconfig.json

      - name: Run Security-Critical Regression Gate
        run: npm run test:security-critical

      - name: Run Full Vitest Suite and Enforce Coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage -- --fileParallelism=false --reporter=verbose 2>&1 | tee vitest.log

      - name: Upload Vitest Log
        if: always()
        # Evidence-only: upload thất bại (vd. hết artifact storage quota)
        # không được làm đỏ quality gate hay chặn deploy-production
        # (deploy chỉ chạy khi workflow conclusion == success).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Coverage Summary
        if: always()
        # Evidence-only: xem comment ở step Upload Vitest Log.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Build Web Application & Backend
        run: npm run build

      - name: Run Design System Guard
        run: npm run lint:ds

  e2e-tests:
    name: Playwright E2E (chromium + webkit)
    runs-on: ubuntu-latest
    # QUALITY-GATE-1 (2026-08-24): E2E chỉ chạy khi unit/typecheck/build đã xanh —
    # trước đây chạy song song nên unit test đỏ vẫn tốn tài nguyên chạy E2E.
    needs: build-and-test

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # E2E khởi động dev server trên DB trống → seedIfEmpty bắt buộc mật khẩu seed
      # (fail-closed, seedAdminPassword.ts). Credential dùng một lần cho CI, không
      # truy cập môi trường thật.
      SEED_ADMIN_PASSWORD: "E2e-Seed-Password-1!"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --allow-remote=all

      - name: Install Playwright Chromium + WebKit
        run: npx playwright install chromium webkit --with-deps

      - name: Run Critical Business E2E Tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:critical

      - name: Run Full Playwright Regression Suite
        if: github.event_name != 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright Runtime Evidence
        if: always()
        # Evidence-only: xem comment ở step Upload Vitest Log.
        # Lưu ý: retention 7 ngày là documented truth (docs/03_DESIGN_SYSTEM.md),
        # không được giảm ở đây.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
