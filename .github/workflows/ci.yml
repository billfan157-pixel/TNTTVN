name: Parish LMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --allow-remote=all

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Typecheck TypeScript
        run: |
          npx tsc -b --noEmit
          npx tsc --noEmit -p server/tsconfig.json

      - name: Run Full Vitest Test Suite
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --fileParallelism=false --reporter=verbose 2>&1 | tee vitest.log

      - name: Upload Vitest Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build Web Application & Backend
        run: npm run build
