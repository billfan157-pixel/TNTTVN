server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A-NEW-29 (2026-08-11): A-NEW-22 (P2) — đồng bộ CSP với application
    # (server/src/middleware/security.ts). Trước đây script-src 'unsafe-inline' —
    # SPA document nhận policy yếu hơn app → XSS injection qua inline script được
    # phép. Giờ script-src 'self' (chặn inline/eval), style-src-attr riêng cho React
    # inline style attributes (giữ nguyên allowance — không phá UI), bổ sung các
    # directive hardening mà app đã có (base-uri/form-action/frame-ancestors/
    # object-src/worker-src/manifest-src/connect-src Sentry). Giữ fonts.googleapis.com
    # + blob: (Google Fonts stylesheet + blob download/preview của SPA).
    # CSP-FONTS (2026-09-08): connect-src thêm fonts.googleapis.com — SW fetch
    # (CacheFirst google-fonts trong sw.ts) chịu CSP của chính response sw.js,
    # thiếu host này Inter fail hoàn toàn trên production (fallback system-ui).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://o0.ingest.sentry.io https://fonts.googleapis.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self';" always;

    # Static Frontend Assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # A15 (2026-08-10): GHI ĐÈ thay vì append — client tự đặt X-Forwarded-For
        # thì phần tử đầu (spoof) bị loại, Node chỉ thấy IP thật (server đọc giá
        # trị cuối khi TRUST_PROXY=true). App luôn set X-Real-IP, nên chuỗi này
        # là defense-in-depth cho trường hợp client gửi thêm header lạ.
        proxy_set_header X-Forwarded-For $remote_addr;
        # A15: dọn header do client tự đặt (không có Cloudflare trong stack).
        # Nginx set giá trị rỗng → upstream nhận header rỗng → getClientIp bỏ qua.
        proxy_set_header cf-connecting-ip "";
    }

    # Health Check
    location /health {
        proxy_pass http://app:3001/health;
    }
}
