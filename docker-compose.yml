version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parish_tntt_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-parish_tntt_production_secure_jwt_secret_2026}
      - BACKUP_DIR=/app/backups
      - DB_PATH=/app/data/parish.db
    volumes:
      - parish_data:/app/data
      - parish_backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: parish_tntt_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  parish_data:
  parish_backups:
