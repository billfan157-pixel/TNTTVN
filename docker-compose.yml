version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-prod}
      - NODE_ENV=production
    volumes:
      - server-data:/app/data

volumes:
  server-data:
